<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="board.css">
<style>
    html, body { width: 1024px; height: 384px; }
    #slots { display: grid; grid-template-columns: repeat(4, 256px); grid-auto-rows: 128px; }
    #slots div { display: flex; align-items: center; justify-content: center; }
    #slots span { height: 88px; padding: 0 26px; border-radius: 44px; background: var(--plate); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .22); display: flex; align-items: center; font-size: 54px; font-weight: 700; white-space: nowrap; }
    #slots .won { color: var(--gold); box-shadow: inset 0 0 0 3px var(--gold); }
</style>
</head>
<body>
<div id="slots"></div>
<script src="board.js"></script>
<script>
    window.addEventListener('message', (e) => {
        const labels = list(e.data && e.data.labels).slice(0, 12)
        document.getElementById('slots').innerHTML = labels.map((l) => {
            const text = (l.won ? '+' : '') + fmt(l.value)
            const size = text.length > 9 ? 34 : text.length > 7 ? 42 : text.length > 6 ? 46 : 54
            return `<div><span class="${l.won ? 'won' : ''}" style="font-size:${size}px">${text}</span></div>`
        }).join('')
    })
</script>
</body>
</html>
